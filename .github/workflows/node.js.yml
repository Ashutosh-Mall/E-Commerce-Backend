name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Backup .env
      run: |
        if [ -f .env ]; then
          cp .env /tmp/env_backup
          echo ".env backup created"
        fi

    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript project
      run: npm run build

    - name: Verify build output
      run: ls dist || echo "No dist folder found"

    - name: Restore .env
      run: |
        if [ -f /tmp/env_backup ]; then
          cp /tmp/env_backup .env
          echo ".env restored"
        fi

    - name: Deploy to server
      run: |
        pm2 restart backend || pm2 start dist/index.js --name backend
        pm2 save
