name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build project
      run: npm run build

    - name: Verify build output
      run: test -d dist

    - name: Check environment file
      run: |
        if [ ! -f .env ]; then
          echo "ERROR: .env file missing!"
          exit 1
        fi

    - name: Deploy to server
      run: |
        pm2 restart backend || pm2 start dist/index.js --name backend
        pm2 save
